# render.yaml — Render.com 蓝图部署
# 通过 GitHub 仓库自动部署，无需 CLI
# 注意: Render 免费层 15 分钟无活动会休眠 (WebSocket 会断开)
# 建议优先使用 Fly.io

services:
  - type: web
    name: wecom-broadcast-relay
    env: docker
    region: singapore  # 新加坡, 离大陆最近
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8080"
