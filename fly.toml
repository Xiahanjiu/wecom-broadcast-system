# fly.toml — Fly.io 部署配置
# 免费额度: 3 个共享 VM, 256MB RAM, 无休眠

app = "wecom-broadcast-relay"
primary_region = "hkg"  # 香港, 离大陆最近延迟最低

[build]
  # 使用 Dockerfile 构建
  builder = "docker"

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 8080
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
    force_https = true

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
