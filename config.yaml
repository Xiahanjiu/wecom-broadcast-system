# ============================================
# 企业微信群发系统  全局配置
# ============================================

# 运行模式: master / worker
mode: master

# ----- 通信配置 -----
relay:
  # WebSocket 中继地址（部署到 Render/Fly.io 后填入）
  url: "ws://localhost:3000"
  # 本地服务端口（主控模式使用）
  master_port: 8080

# ----- 局域网发现 -----
lan_discovery:
  enabled: true
  # 服务类型 (mDNS)
  service_type: "_wecom-broadcast._tcp.local."
  # 发现超时(秒)
  timeout: 5

# ----- 监控配置 -----
monitor:
  # 聊天列表轮询间隔(秒)
  poll_interval: 30
  # 执行端心跳间隔(秒)
  heartbeat_interval: 10
  # 离线判定阈值(秒)
  offline_threshold: 30
  # 是否启用 OCR 降级
  ocr_fallback: true

# ----- 预警配置 -----
alert:
  # 超时阈值(秒)  客户发言后超过此时间无回复则触发
  timeout_seconds: 300
  # 预警去重窗口(秒)  同一群在此窗口内不重复弹窗
  dedup_window: 60
  # 预警升级阈值
  escalation:
    warning: 300    # 5分钟: 全端弹窗
    critical: 600   # 10分钟: 严重标记
    severe: 900     # 15分钟: 严重超时事件
  # 声音文件
  sound_file: "app/web/static/alert.wav"

# ----- 发送配置 -----
send:
  # 群间随机延迟范围(秒)  防止触发风控
  delay_min: 2
  delay_max: 5
  # 定时群发 Cron 表达式 (默认每天 9:00)
  schedule_cron: "0 9 * * *"
  # 发送失败重试次数
  retry_count: 3

# ----- 日志配置 -----
logging:
  level: INFO
  file: "logs/app.log"
  max_size_mb: 10
  backup_count: 7
  # 日志格式
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

