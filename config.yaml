# ============================================
# 企业微信群发系统 — 全局配置
# ============================================

# 运行模式: master / worker
mode: master

# ----- 通信配置 -----
relay:
  # WebSocket 中继地址（start_master.ps1 启动时自动填入）
  url: "ws://localhost:3000"
  # 本地服务端口（主控模式使用）
  master_port: 8080

# ----- 局域网发现 -----
lan_discovery:
  enabled: true
  service_type: "_wecom-broadcast._tcp.local."
  timeout: 5

# ----- 监控配置 -----
monitor:
  poll_interval: 30
  heartbeat_interval: 10
  offline_threshold: 30
  ocr_fallback: true

# ----- 预警配置 -----
alert:
  timeout_seconds: 300
  dedup_window: 60
  escalation:
    warning: 300
    critical: 600
    severe: 900
  sound_file: "app/web/static/alert.wav"

# ----- 发送配置 -----
send:
  delay_min: 2
  delay_max: 5
  schedule_cron: "0 9 * * *"
  retry_count: 3

# ----- 日志配置 -----
logging:
  level: INFO
  file: "logs/app.log"
  max_size_mb: 10
  backup_count: 7
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
