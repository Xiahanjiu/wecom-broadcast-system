# 员工名称识别规则
# ============================================
# 优先方案: UIA 扫描群成员面板 → 读取企微"客户"标签
# 降级方案: 员工前缀 + 正则 + 白名单/黑名单
# ============================================

# 员工统一前缀 (如公司简称)，可选
# 匹配此前缀的发言者直接视为员工
# 例: staff_prefix: "某某科技"
staff_prefix: ""

# 降级方案: 正则规则 (UIA 扫描不可用时使用)
regex:
  - ".*@.*"           # 名称中包含 @
  - ".*客服.*"         # 名称中包含"客服"

# 白名单 — 精确匹配视为员工
whitelist: []

# 黑名单 — 精确匹配强制视为客户（优先级最高）
blacklist: []
